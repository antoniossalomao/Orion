[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietario"
publish = false
rust-version = "1.85"

[workspace.dependencies]
orion-policy = { path = "crates/orion-policy" }
orion-store = { path = "crates/orion-store" }
orion-mcp = { path = "crates/orion-mcp" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
libc = "0.2"
chrono-tz = "0.10"
unicode-normalization = "0.1"
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "5"
orion-ai = { path = "crates/orion-ai" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "multipart"] }
futures = "0.3"
async-stream = "0.3"
url = "2"
keyring = "3"
wait-timeout = "0.2"
html-escape = "0.2"
orion-core = { path = "crates/orion-core" }
dotenvy = "0.15"
jsonschema = { version = "0.26", default-features = false }
similar = "2"
sysinfo = "0.32"
arboard = { version = "3", default-features = false }
starship-battery = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
pdf-extract = "0.7"
printpdf = "0.7"
csv = "1"
pbkdf2 = "0.12"
hmac = "0.12"
subtle = "2"
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rpassword = "7"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# PBKDF2 com 600 mil iterações e SQLite ficam lentos demais sem otimização
[profile.dev.package."*"]
opt-level = 2
