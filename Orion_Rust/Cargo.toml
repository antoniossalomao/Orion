[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietario"
publish = false
rust-version = "1.85"

[workspace.dependencies]
orion-policy = { path = "crates/orion-policy" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
