[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietario"
publish = false
rust-version = "1.85"

[workspace.dependencies]
orion-policy = { path = "crates/orion-policy" }
orion-store = { path = "crates/orion-store" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
unicode-normalization = "0.1"
dirs = "5"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
