# cargo-deny: licenças, avisos de segurança, bans e origens das dependências.
# Rodar à mão: `cargo deny check` (instalar com `cargo install cargo-deny --locked`).
# Roda no CI (rust-windows.yml) em todo PR. Escrito a partir das licenças reais do Cargo.lock.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Cada exceção tem motivo e é dívida rastreada no issue #135 (remover ao atualizar a dependência).
ignore = [
    { id = "RUSTSEC-2026-0187", reason = "lopdf (printpdf 0.7 e pdf-extract 0.7): corrigido só na 0.42; exige trocar as bibliotecas de PDF. Entrada de PDF vem do próprio usuário." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.36 direto em orion-core: atualizar para >=0.41 muda a API." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.36 direto em orion-core: atualizar para >=0.41 muda a API." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30 via rusqlite 0.32: corrigido no rusqlite 0.41 (salto grande de versão)." },
    { id = "RUSTSEC-2026-0543", reason = "chrono sem manutenção; sem substituto seguro ainda." },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz sem manutenção; sem substituto seguro ainda." },
]

[licenses]
version = 2
# Os crates do próprio workspace são privados (LicenseRef-Proprietario, publish = false).
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
