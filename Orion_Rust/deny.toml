# cargo-deny: licenças, avisos de segurança, bans e origens das dependências.
# Rodar à mão: `cargo deny check` (instalar com `cargo install cargo-deny --locked`).
# O CI está pausado desde 21/10/2026; este arquivo foi escrito a partir das licenças reais do Cargo.lock.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Os crates do próprio workspace são privados (LicenseRef-Proprietario, publish = false).
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
