[package]
name = "orion-store"
description = "Memória do Orion em SQLite (FTS5 e vetores), mesmo esquema do Python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Banco cifrado (SQLCipher + OpenSSL embutido). Desligado por padrão: o esquema é compartilhado com o
# Python durante a transição e a chave ainda não é pedida na subida do servidor.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
orion-policy.workspace = true
rusqlite.workspace = true
parking_lot.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
orion-testkit.workspace = true
