[package]
name = "orion-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orion_app"
path = "src/lib.rs"

[[bin]]
name = "orion-app"
path = "src/main.rs"

[[bin]]
name = "orion-snap"
path = "src/bin/orion-snap.rs"
required-features = ["snap"]

[features]
# Gera os PNG de cada tela sem janela (renderizador tiny-skia), para comparar com o protótipo.
snap = ["dep:iced_test"]
# Ferramentas de desenvolvimento do iced 0.14: painel de depuração (F12), viagem no tempo e hot reload.
# Uso: `cargo dev` (ver docs/FERRAMENTAS-DEV.md). Nunca entra no pacote de release.
dev = ["iced/debug", "iced/hot", "iced/time-travel"]

[dependencies]
iced = { workspace = true, features = ["lazy"] }
zeroize.workspace = true
iced_test = { version = "0.14.0", optional = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sysinfo.workspace = true
tracing.workspace = true
regex.workspace = true
fluent-bundle = "0.15.3"
# Reduz e guarda em WebP as imagens do chat (cache de 1 GB); só os formatos que o app abre.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream.workspace = true
orion-platform = { path = "../orion-platform" }
orion-sky = { path = "../orion-sky" }

[dev-dependencies]
iced_runtime = "0.14"
