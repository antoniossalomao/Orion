[package]
name = "orion-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orion_app"
path = "src/lib.rs"

[[bin]]
name = "orion-app"
path = "src/main.rs"

[[bin]]
name = "orion-snap"
path = "src/bin/orion-snap.rs"
required-features = ["snap"]

[features]
# Gera os PNG de cada tela sem janela (renderizador tiny-skia), para comparar com o protótipo.
snap = ["dep:iced_test"]

[dependencies]
iced.workspace = true
iced_test = { version = "0.14.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream.workspace = true
orion-platform = { path = "../orion-platform" }

[dev-dependencies]
iced_runtime = "0.14"
