name: Windows App e instalador (GPU automática)
# Só compila e empacota o app: wgpu com GPU real, tiny-skia para adaptador de CPU.
# Sem testes, sem Vulkan para IA local e sem modelo de IA.
# O modelo pesado baixa pelo instalador; as chaves de API (Gemini, Cerebras...) valem sem modelo local.
# Só manual (workflow_dispatch), como manda o ADR 0007: o CI automático segue pausado.
# O botão "Run workflow" só aparece depois que este arquivo estiver na branch principal.
# Rápido de propósito: o `rust-windows.yml` roda a suíte inteira, compila a versão Vulkan e baixa um modelo.
on:
  workflow_dispatch:
    inputs:
      perfil:
        description: "release é mais rápido de usar; debug compila mais depressa"
        type: choice
        options: [release, debug]
        default: release
      cifra:
        description: "Banco cifrado (SQLCipher): compila o OpenSSL junto e demora mais"
        type: boolean
        default: false
      llama:
        description: "Incluir o orion-llama.exe (modelos locais; compila o llama.cpp e demora mais)"
        type: boolean
        default: false
      instalador:
        description: "Incluir Orion Setup.exe e pacote offline do app (sem baixar modelos)"
        type: boolean
        default: false
concurrency:
  group: windows-app-cpu-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Orion_Rust
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Alvo curto: evita caminhos longos no MSBuild.
      CARGO_TARGET_DIR: C:\t
      PERFIL: ${{ inputs.perfil || 'release' }}
      CIFRA: ${{ inputs.cifra && 'true' || 'false' }}
      LLAMA: ${{ inputs.llama && 'true' || 'false' }}
      INSTALADOR: ${{ inputs.instalador && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Orion_Rust -> C:/t
          key: app-cpu-${{ inputs.perfil || 'release' }}
      - name: Instalar NASM para o OpenSSL embutido do SQLCipher
        if: env.CIFRA == 'true'
        shell: pwsh
        run: |
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Compilar
        shell: pwsh
        run: |
          $a = @('build', '--locked', '-p', 'orion-server')
          if ($env:INSTALADOR -eq 'true') { $a += @('-p', 'orion-setup') }
          if ($env:LLAMA -eq 'true') { $a += @('-p', 'orion-llama') }
          if ($env:CIFRA -eq 'true') { $a += @('--features', 'orion-server/sqlcipher') }
          if ($env:PERFIL -eq 'release') { $a += '--release' }
          cargo @a
          if ($LASTEXITCODE -ne 0) { throw "cargo build falhou ($LASTEXITCODE)" }
      - name: Montar a pasta do app
        shell: pwsh
        run: |
          $bin = "C:\t\$env:PERFIL"
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item "$bin\orion.exe" pacote\
          if ($env:LLAMA -eq 'true') { Copy-Item "$bin\orion-llama.exe" pacote\ }
          if ($env:INSTALADOR -eq 'true') {
            New-Item -ItemType Directory -Force pacote\cpu | Out-Null
            Copy-Item "$bin\orion-setup.exe" 'pacote\Orion Setup.exe'
            Copy-Item "$bin\orion.exe" pacote\cpu\
            if ($env:LLAMA -eq 'true') { Copy-Item "$bin\orion-llama.exe" pacote\cpu\ }
          }
          @(
            "Orion para Windows: app com GPU automática",
            "Perfil: $env:PERFIL | Banco cifrado: $env:CIFRA | Instalador: $env:INSTALADOR | orion-llama: $env:LLAMA",
            "Interface: GPU automática (wgpu); tiny-skia se só houver adaptador de CPU.",
            "Nenhum peso de modelo local vem neste pacote e nenhum modelo é baixado pelo build.",
            "",
            $(if ($env:INSTALADOR -eq 'true') { 'Para instalar, extraia TODO o pacote, mantenha a pasta cpu junto e execute Orion Setup.exe. Para usar somente APIs, deixe todos os modelos locais, voz e Vulkan desmarcados.' } else { 'Pacote portátil: execute orion.exe; o assistente dentro do app configura o primeiro uso.' }),
            "Rode orion.exe. O Windows pode avisar 'app não reconhecido' (SmartScreen) porque o executável não é assinado:",
            "clique em Mais informações e depois em Executar assim mesmo.",
            "Sem banco cifrado, desmarque 'Cifrar meu banco' no passo de segurança do primeiro uso.",
            "Para conversar, cole uma chave de API no primeiro uso ou em Configurações > Modelos; a chave vale sem reabrir.",
            "Logs: %APPDATA%\orion\logs (Configurações > Sistema > Mostrar avançado > Abrir pasta de logs)."
          ) | Set-Content -Encoding utf8 pacote\LEIA-ME.txt
          if ($env:INSTALADOR -eq 'true' -and (!(Test-Path 'pacote\Orion Setup.exe') -or !(Test-Path pacote\cpu\orion.exe))) {
            throw 'Pacote do instalador incompleto'
          }
          if ($env:LLAMA -ne 'true' -and (Get-ChildItem pacote -Recurse -Filter orion-llama.exe)) {
            throw 'Worker local incluído sem seleção'
          }
          Get-ChildItem pacote -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath((Resolve-Path pacote), $_.FullName)
            "$hash  $relative"
          } | Set-Content -Encoding utf8 pacote\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Orion-Windows-App
          path: Orion_Rust/pacote
          if-no-files-found: error
