name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fase 1 do NUCLEO: o pacote orion/ tem de passar em Windows e macOS (o notebook
  # de hoje e o MacBook de amanhã), além do Linux.
  orion:
    name: orion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ORION_REQUIRE_VECTORS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check orion tests
      - run: uv run pyright
      - run: uv run pytest -q

  # O legado (Orion_Ollama/, Orion_Core/) só ganha o essencial até a fase 7:
  # sintaxe + erros reais do pyflakes. Os testes dele rodam no job acima.
  legado:
    name: legado (sintaxe e F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: python -m compileall -q Orion_Ollama Orion_Core
      - run: uvx ruff check --isolated --select E9,F Orion_Ollama Orion_Core
