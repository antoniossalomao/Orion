name: Rust Windows
# Desativado por enquanto: roda ~30 min e falha. Só manualmente (workflow_dispatch).
# Para reativar, restaure o gatilho:
#   pull_request:
#     paths: ["Orion_Rust/**", "scripts/smoke_local_windows.py",
#             "tests/mcp_cliente/servidor_cru.py", ".github/workflows/rust-windows.yml"]
on:
  workflow_dispatch:
concurrency:
  group: rust-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Orion_Rust
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Mesmo alvo curto para CPU/Vulkan: evita duplicar iced e caminhos longos no MSBuild.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Orion_Rust -> C:/t
      - name: Instalar NASM para o OpenSSL embutido do SQLCipher
        shell: pwsh
        run: |
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          perl -v | Select-Object -First 2
      - name: Testar domínio, canais, orçamento e áudio
        run: cargo test --locked -p orion-policy -p orion-store -p orion-ai -p orion-core -p orion-server -p orion-platform -p orion-voice -p orion-local -p orion-llama -p orion-setup -p orion-sky -p orion-mcp -p orion-vault -p orion-updater -p orion-app -p orion-testkit
      - name: Testar banco cifrado (SQLCipher), chaves e logs cifrados
        run: cargo test --locked -p orion-store -p orion-core --features orion-store/sqlcipher,orion-core/sqlcipher
      - name: Compilar controle nativo
        run: cargo build --locked -p orion-server -p orion-llama
      - name: Guardar runtime CPU sem dependência de driver Vulkan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote/cpu | Out-Null
          Copy-Item C:\t\debug\orion.exe pacote/cpu/
          Copy-Item C:\t\debug\orion-llama.exe pacote/cpu/
      - uses: actions/cache@v6
        with:
          path: C:\orion-models
          key: qwen3-06b-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      - name: Testar GGUF real no worker CPU
        run: python ../scripts/smoke_local_windows.py C:\t\debug\orion.exe C:\orion-models
      - name: Instalar SDK para conferir o backend Vulkan
        shell: pwsh
        run: |
          # O feed do Chocolatey devolve 503 de vez em quando: tenta de novo antes de falhar.
          for ($i = 1; $i -le 4; $i++) {
            choco install vulkan-sdk --version=1.4.341 -y --no-progress
            if (Test-Path 'C:\VulkanSDK') { break }
            if ($i -lt 4) { Start-Sleep -Seconds (30 * $i) }
          }
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (!(Test-Path "$sdk\Bin\glslc.exe")) { throw 'SDK Vulkan sem glslc' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Compilar pacote Windows com Whisper e llama.cpp Vulkan
        # O gerador Visual Studio (MSBuild 18) roda o install do ExternalProject vulkan-shaders-gen
        # antes do configure terminar ("Not a file: cmake_install.cmake"); o Ninja respeita a ordem.
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo build --locked -p orion-server -p orion-setup -p orion-llama --features orion-server/local-vulkan,orion-server/sqlcipher,orion-llama/vulkan
      - name: Montar pacote do instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote/vulkan | Out-Null
          Copy-Item C:\t\debug\orion.exe pacote/vulkan/
          Copy-Item C:\t\debug\orion-llama.exe pacote/vulkan/
          Copy-Item C:\t\debug\orion-setup.exe 'pacote\Orion Setup.exe'
          Copy-Item models\orion-wake-candidate pacote\wake-candidate -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Orion-native-Windows-Vulkan
          path: Orion_Rust/pacote
          if-no-files-found: error
