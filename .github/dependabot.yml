version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/Orion_Rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
