<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orion iced Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: janela de desktop com barra de título própria; barra lateral, palco e painel da direita em abas; configurações em modal.
   Um único tema: Grafite escuro (decidido em 15/10). Rigel pálido nos botões principais, Rigel no foco e seleção,
   Betelgeuse para atenção. Verde só ok, vermelho só destrutivo. Céu na entrada, no início e no grafo. */
:root {
  color-scheme: dark;
  --bg: #151618; --side: #111214; --raise: #1b1c1f; --raise-2: #222327; --sel: #26272b; --hover: #1e1f22;
  --line: rgb(255 255 255 / .065); --line-2: rgb(255 255 255 / .11); --line-3: rgb(255 255 255 / .2);
  --fg: #ececee; --fg-2: #a9aab0; --fg-3: #75767d; --fg-4: #4e4f55;
  --primary: #b9c6ea; --primary-ink: #0f1320;
  --accent: #a4b3de; --accent-soft: rgb(164 179 222 / .12);
  --signal: #e9b467; --signal-soft: rgb(233 180 103 / .11);
  --ok: #74cfae; --ok-soft: rgb(116 207 174 / .11);
  --danger: #f07c88; --danger-soft: rgb(240 124 136 / .11);
  --n-projeto: #e9b467; --n-area: #d98f6a; --n-conceito: #9fb2ea; --n-pesquisa: #82cfa6; --n-recurso: #a7abb6; --n-conversa: #e796bf; --n-relatorio: #6a6e78;
  --scrim: rgb(6 6 8 / .6);
  --shadow: 0 24px 60px rgb(0 0 0 / .5), 0 2px 10px rgb(0 0 0 / .28);
  --star: #eef0f6;

  --ui: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --mono: 'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
  --chat-font: var(--serif); --chat-fs: 16.5px; --thread-w: 46rem;
  --side-w: 272px; --ctx-w: 320px; --bar-h: 46px; --row: 32px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
body.compact { --row: 26px; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
input, textarea { background: none; border: 0; outline: none; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 14px; height: 14px; }
.grow { flex: 1; }
.muted { color: var(--fg-3); }
.mono { font-family: var(--mono); font-size: 12px; }
kbd { font-family: var(--mono); font-size: 10.5px; color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.reduce *, .reduce *::before, .reduce *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.belt { display: inline-flex; align-items: center; gap: 3px; flex: none; }
.belt i { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
.belt i:nth-child(1) { translate: 0 -3px; }
.belt i:nth-child(3) { translate: 0 3px; }
.belt.lg { gap: 6px; }
.belt.lg i { width: 7px; height: 7px; }
.belt.lg i:nth-child(1) { translate: 0 -6px; }
.belt.lg i:nth-child(3) { translate: 0 6px; }

.ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--fg-3); flex: none; transition: background .15s, color .15s; }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib[aria-pressed="true"] { color: var(--fg); background: var(--sel); }
.ib:disabled { opacity: .3; cursor: default; background: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); color: var(--fg); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; text-decoration: none; }
.btn:hover { background: var(--hover); border-color: var(--line-3); }
.btn-primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn-primary:hover { background: var(--primary); filter: brightness(1.06); border-color: transparent; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-ghost { border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { border-color: transparent; color: var(--fg); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }

/* Entrada */
.gate { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.gate-card { position: relative; width: min(340px, 100%); display: flex; flex-direction: column; gap: 14px; }
.gate-card .belt { margin-bottom: 6px; }
.gate-card h1 { margin: 0; font: 400 40px/1 var(--serif); letter-spacing: -.02em; }
.gate-card p { margin: 0; color: var(--fg-2); font-size: 13.5px; }
.field { height: 42px; width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 14px; background: color-mix(in srgb, var(--raise) 85%, transparent); backdrop-filter: blur(6px); }
.field:focus { border-color: var(--line-3); }
.gate-err { min-height: 18px; font-size: 12px; color: var(--danger) !important; }
.gate .btn { height: 42px; justify-content: center; font-size: 14px; }
.gate-note { font-size: 12px !important; color: var(--fg-3) !important; }

/* Janela */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; }
.app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.app.collapsed .side { visibility: hidden; }
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-right: 1px solid var(--line); padding: 0 8px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); overflow: hidden; }
.side-top { display: flex; align-items: center; gap: 2px; height: var(--bar-h); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font: 500 15px var(--ui); letter-spacing: .01em; }
.side-search { position: relative; margin: 4px 0 10px; flex: none; }
.side-search .i { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--fg-3); }
.side-search input { width: 100%; height: 32px; padding: 0 10px 0 32px; border-radius: 8px; background: var(--hover); font-size: 13px; border: 1px solid transparent; }
.side-search input:focus { border-color: var(--line-2); background: var(--bg); }
.side-search input:focus-visible { outline: none; }
.side-search input::placeholder { color: var(--fg-3); }
.nav { display: flex; flex-direction: column; gap: 1px; flex: none; }
.nav-i { display: flex; align-items: center; gap: 11px; height: var(--row); padding: 0 10px; border-radius: 8px; color: var(--fg-2); font-size: 13.5px; width: 100%; transition: background .15s, color .15s; }
.nav-i:hover { background: var(--hover); color: var(--fg); }
.nav-i[aria-current="page"] { background: var(--sel); color: var(--fg); }
.nav-i .ndot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.nav-i .cnt { margin-left: auto; font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--signal-soft); color: var(--signal); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.nav-i kbd { margin-left: auto; opacity: 0; transition: opacity .15s; }
.nav-i:hover kbd { opacity: 1; }
.nav-more .i { transition: rotate .2s var(--ease); }
.nav-more[aria-expanded="true"] .i { rotate: 90deg; }
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.sec { margin: 18px 10px 4px; font-size: 11.5px; color: var(--fg-3); letter-spacing: .01em; }
.conv { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; width: 100%; padding: 6px 10px; border-radius: 8px; transition: background .15s; }
body.compact .conv { padding: 3px 10px; }
.conv:hover { background: var(--hover); }
.conv[aria-current="true"] { background: var(--sel); }
.conv-t { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--fg); min-width: 0; }
.conv-t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-t .i { color: var(--fg-3); width: 12px; height: 12px; }
.conv-s { grid-column: 1; font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-i { grid-column: 2; grid-row: 1 / 3; align-self: center; display: flex; }
.cdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.cdot.pending { background: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.cdot.unread { background: var(--accent); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-3); border-top-color: var(--fg); animation: spin .9s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.side-empty { padding: 10px; font-size: 13px; color: var(--fg-3); }
.side-foot { display: flex; align-items: center; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); flex: none; }
.me { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 40px; padding: 0 8px; border-radius: 8px; }
.me:hover { background: var(--hover); }
.avatar { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--raise-2); border: 1px solid var(--line-2); font-size: 10.5px; font-weight: 600; flex: none; }
.me-n { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-n span { color: var(--fg-3); font-size: 12px; }
.me .i { margin-left: auto; color: var(--fg-3); }
.okdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 4px; height: var(--bar-h); padding: 0 6px 0 12px; padding-right: max(6px, env(safe-area-inset-right, 0px)); flex: none; }
.bar-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13.5px; font-weight: 500; }
.bar-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.bar-title:hover { background: var(--hover); }
.bar-title .i { color: var(--fg-3); }
.only-collapsed, .only-mobile { display: none; }
.app.collapsed .only-collapsed { display: inline-grid; }
.bar-cmd { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; color: var(--fg-3); font-size: 12.5px; }
.bar-cmd:hover { background: var(--hover); color: var(--fg); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; color: var(--fg-2); margin-right: 4px; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); }
.pill.wait { border-color: color-mix(in srgb, var(--signal) 40%, transparent); color: var(--fg); }
.pill.wait i { background: var(--signal); }
.pill.busy i { background: var(--signal); animation: pulse 1.2s var(--ease) infinite; }
.pill.auto { border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--fg); }
.pill.auto i { background: var(--accent); }
.pill.cam { border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--fg); }
.pill.cam i { background: #ff4d5e; }
@keyframes pulse { 50% { opacity: .3; } }
.vsep { width: 1px; height: 18px; background: var(--line-2); margin: 0 6px; }
.wc { width: 34px; }
.wc.close:hover { background: var(--danger); color: #fff; }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.body.with-ctx { grid-template-columns: minmax(0, 1fr) var(--ctx-w); }
.stage { min-width: 0; min-height: 0; position: relative; }
.scroll { position: absolute; inset: 0; overflow-y: auto; }
.fade-in { animation: fadein .22s var(--ease); }
@keyframes fadein { from { opacity: 0; translate: 0 3px; } }

/* Início com a constelação ao fundo */
.home-wrap { position: absolute; inset: 0; overflow: hidden; }
.home { position: relative; min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-block: 40px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-in { position: relative; width: min(660px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; letter-spacing: .14em; color: var(--fg-3); font-weight: 500; }
.hello { margin: 4px 0 22px; text-align: center; font: 400 clamp(34px, 5vw, 46px)/1.08 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
.hello em { font-style: italic; color: var(--fg-2); }
.status-line { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 12px; color: var(--fg-3); }
.status-line span { display: inline-flex; align-items: center; gap: 6px; }
.suggest { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
.sugg { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; color: var(--fg-2); background: color-mix(in srgb, var(--bg) 70%, transparent); transition: border-color .15s, color .15s; }
.sugg:hover { border-color: var(--line-3); color: var(--fg); }
.sugg.warn { color: var(--fg); border-color: color-mix(in srgb, var(--signal) 40%, transparent); }

/* Composer */
.cmp-wrap { position: relative; }
.composer { border: 1px solid var(--line-2); border-radius: 18px; background: var(--raise); box-shadow: 0 10px 30px rgb(0 0 0 / .18); transition: border-color .15s; }
.composer:focus-within { border-color: var(--line-3); }
.composer textarea { display: block; width: 100%; min-height: 54px; max-height: 220px; resize: none; padding: 16px 18px 4px; font-size: 15px; line-height: 1.55; }
.composer textarea:focus-visible { outline: none; }
.composer textarea::placeholder { color: var(--fg-3); }
.cmp-foot { display: flex; align-items: center; gap: 2px; padding: 6px 8px 8px; flex-wrap: wrap; }
.attach { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 8px; border-radius: 7px; background: var(--raise-2); font-size: 12px; color: var(--fg-2); }
.attach small { color: var(--fg-3); }
.attach button { color: var(--fg-3); display: grid; }
.send { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); margin-left: 4px; }
.send:disabled { background: var(--raise-2); color: var(--fg-4); cursor: default; }
.cmp-meta { display: flex; align-items: center; gap: 2px; padding: 0 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; font-size: 12.5px; color: var(--fg-2); }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip .soft { color: var(--fg-3); }
.suggest-box { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 6px); z-index: 7; padding: 4px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; }
.home .suggest-box { bottom: auto; top: calc(100% + 6px); }
.suggest-box button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
.suggest-box button.hl, .suggest-box button:hover { background: var(--hover); }
.suggest-box b { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
.suggest-box span { color: var(--fg-3); font-size: 12px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }

/* Conversa */
.chat { display: flex; flex-direction: column; height: 100%; }
.thread { flex: 1; min-height: 0; overflow-y: auto; }
.thread-in { width: min(var(--thread-w), 100%); margin: 0 auto; padding-block: 28px 36px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 30px; }
.pinned { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line-2); font-size: 12.5px; color: var(--fg-2); }
.pinned .i { color: var(--fg-3); }
.m-user-wrap { align-self: flex-end; max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.m-user { background: var(--raise-2); border-radius: 16px; padding: 10px 15px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.m-user-act { display: flex; gap: 0; opacity: 0; transition: opacity .15s; }
.m-user-wrap:hover .m-user-act, .m-user-wrap:focus-within .m-user-act { opacity: 1; }
.m-user-act .ib { width: 26px; height: 26px; }
.m-orion { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.m-body { font-family: var(--chat-font); font-size: var(--chat-fs); line-height: 1.65; overflow-wrap: anywhere; }
.m-body p { margin: 0 0 .8em; }
.m-body p:last-child { margin-bottom: 0; }
.m-body ol, .m-body ul { margin: 0 0 .8em; padding-left: 1.3em; }
.m-body li { margin: .3em 0; padding-left: .2em; }
.m-body li::marker { color: var(--fg-3); }
.m-body b { font-weight: 600; }
.m-body code { font-family: var(--mono); font-size: .78em; background: var(--raise-2); border-radius: 5px; padding: .1em .38em; }
.m-body pre { margin: 0 0 .9em; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--side); overflow-x: auto; font: 12.5px/1.65 var(--mono); }
.m-body pre code { background: none; padding: 0; font-size: inherit; }
.tk-k { color: var(--accent); } .tk-c { color: var(--fg-3); } .tk-n { color: var(--signal); }
.cursor { display: inline-block; width: 7px; height: 1em; vertical-align: -2px; background: var(--fg-2); border-radius: 1px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tools { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 13px; color: var(--fg-3); }
.tools:hover { color: var(--fg); }
.tools .i { transition: rotate .2s var(--ease); }
.tools[aria-expanded="true"] .i { rotate: 90deg; }
.tool-list { display: flex; flex-direction: column; margin: -4px 0 0 3px; padding-left: 14px; border-left: 1px solid var(--line-2); }
.tool-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--fg-2); padding: 3px 0; }
.tool-row .k { color: var(--fg-3); }
.tool-row .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-row .t { color: var(--fg-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.appr { border: 1px solid color-mix(in srgb, var(--signal) 34%, transparent); background: var(--signal-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 40rem; }
.appr-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--signal); }
.appr-h .cdot { background: var(--signal); }
.appr p { margin: 0; font-size: 13.5px; color: var(--fg-2); }
.appr-a { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.appr.done { background: none; border-color: var(--line); padding: 10px 14px; }
.appr.done .appr-h { color: var(--fg-2); }
.appr.done .appr-h .cdot { background: var(--ok); }
.appr.done.no .appr-h .cdot { background: var(--fg-3); }
.m-act { display: flex; align-items: center; margin-left: -6px; color: var(--fg-3); }
.m-act .ib { width: 28px; height: 28px; }
.m-act .t { font-size: 11.5px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.m-act .via { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: 11.5px; color: var(--fg-4); padding: 2px 6px; border-radius: 6px; }
.m-act .via:hover { color: var(--fg-2); background: var(--hover); }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); }
.chat-cmp { width: min(var(--thread-w), 100%); margin: 0 auto; padding-bottom: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 4px; flex: none; }
.chat-empty { margin: auto; text-align: center; color: var(--fg-3); padding: 48px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.chat-empty h2 { margin: 0; font: 400 28px/1.15 var(--serif); color: var(--fg); }
.banner { display: flex; align-items: center; gap: 8px; margin: 0 auto 6px; width: min(var(--thread-w), 100%); padding: 6px 12px; border-radius: 9px; background: var(--raise); border: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); }
.banner .cdot { background: var(--signal); }

/* Painel da direita em abas */
.ctx { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--side); }
.ctx-tabs { display: flex; gap: 2px; padding: 8px 8px 0; padding-right: max(8px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); flex: none; }
.ctx-tabs button { height: 32px; padding: 0 10px; font-size: 12.5px; color: var(--fg-3); border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
.ctx-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.ctx-tabs button:hover { color: var(--fg); }
.ctx-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; padding-right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--raise); }
.card-h { display: flex; align-items: center; gap: 6px; width: 100%; padding: 10px 12px; font-size: 12.5px; font-weight: 500; }
.card-h .r { margin-left: auto; color: var(--fg-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.card-b { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--fg-2); }
.kv { display: flex; align-items: center; gap: 8px; min-width: 0; }
.kv .i { color: var(--fg-3); }
.kv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 3px; border-radius: 3px; background: var(--raise-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg-2); border-radius: 3px; }
.diff { display: flex; gap: 6px; font: 11.5px var(--mono); }
.diff .a { color: var(--ok); } .diff .d { color: var(--danger); }
.tree { font: 12.5px/1.9 var(--mono); color: var(--fg-2); }
.tree div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .dir { color: var(--fg); }
.tree .chg { color: var(--signal); }
.diffview { font: 12px/1.7 var(--mono); border-radius: 10px; border: 1px solid var(--line); overflow-x: auto; background: var(--bg); }
.diffview div { padding: 0 10px; white-space: pre; }
.diffview .h { color: var(--fg-3); background: var(--raise); padding-block: 4px; }
.diffview .add { background: color-mix(in srgb, var(--ok) 10%, transparent); color: var(--ok); }
.diffview .del { background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); }
.term { flex: 1; min-height: 240px; display: flex; flex-direction: column; border-radius: 10px; border: 1px solid var(--line); background: #0b0c0d; font: 12px/1.6 var(--mono); color: #cfd2d8; }
.term-out { flex: 1; overflow-y: auto; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.term-in { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line); }
.term-in span { color: var(--accent); }
.term-in input { flex: 1; font: inherit; color: inherit; }

/* Páginas */
.page { width: min(800px, 100%); margin: 0 auto; padding-block: 36px 72px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.page-h { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.page-h > div { flex: 1; min-width: 220px; }
.page-h h1 { margin: 0 0 4px; font: 400 32px/1.1 var(--serif); letter-spacing: -.015em; }
.page-h p { margin: 0; font-size: 13px; color: var(--fg-3); }
.tools-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search .i { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--fg-3); }
.search input { width: 100%; height: 34px; padding: 0 12px 0 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--raise); font-size: 13px; }
.search input:focus { border-color: var(--line-3); }
.search input:focus-visible { outline: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pcard { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border: 1px solid var(--line-2); border-radius: 14px; min-height: 150px; transition: border-color .15s, background .15s; text-align: left; }
.pcard:hover { border-color: var(--line-3); background: var(--raise); }
.pcard-t { font: 400 20px/1.2 var(--serif); }
.pcard-d { font-size: 13px; color: var(--fg-2); }
.pcard-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.pcard-m { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-3); }
.list { border-top: 1px solid var(--line); }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); }
.li-t { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.li-d { font-size: 12.5px; color: var(--fg-3); margin-top: 1px; }
.li-r { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex-wrap: wrap; justify-content: flex-end; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; }
.badge.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.badge.warn { color: var(--signal); background: var(--signal-soft); border-color: transparent; }
.badge.err { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.badge.info { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.runs { display: inline-flex; gap: 3px; }
.runs i { width: 8px; height: 8px; border-radius: 2px; background: var(--ok); }
.runs i.f { background: var(--danger); } .runs i.s { background: var(--fg-4); }
.qcard { border: 1px solid color-mix(in srgb, var(--signal) 30%, transparent); background: var(--signal-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.qcard-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-3); }
.qcard-t { font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 16px 4px; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
.stat b { display: block; font: 400 30px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--fg-3); }
.h3 { font-size: 11.5px; color: var(--fg-3); margin: 26px 4px 8px; font-weight: 500; letter-spacing: .02em; }
.hbar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 70px; gap: 12px; align-items: center; padding: 7px 4px; font-size: 13px; color: var(--fg-2); }
.hbar span:last-child { text-align: right; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.hbar .meter { height: 5px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg-3); font: 10.5px var(--ui); font-variant-numeric: tabular-nums; }
.legend-inline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 10px; height: 2px; border-radius: 1px; }
.edit-in { width: 100%; height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line-3); background: var(--raise); font-size: 14px; }

/* Memória: grafo do vault */
.mem { position: absolute; inset: 0; display: flex; flex-direction: column; }
.mem-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 16px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 6; }
.mem-bar .search { flex: 0 1 260px; min-width: 180px; }
.fchips { display: flex; gap: 4px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--fg-3); transition: color .15s, border-color .15s, opacity .15s; }
.fchip[aria-pressed="true"] { color: var(--fg); }
.fchip[aria-pressed="false"] { opacity: .5; border-style: dashed; }
.fchip i, .ldot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.mem-stats { margin-left: auto; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mem-res { position: absolute; top: 44px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(320px, calc(100% - 32px)); padding: 4px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; }
.mem-res button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
.mem-res button:hover, .mem-res button.hl { background: var(--hover); }
.mem-res button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem-res small { color: var(--fg-3); font-size: 11.5px; }
.mem-stage { position: relative; flex: 1; min-height: 0; margin: 0 12px 0; margin-left: max(12px, env(safe-area-inset-left, 0px)); margin-right: max(12px, env(safe-area-inset-right, 0px)); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 45%, #15192a 0%, #0b0c10 72%); }
.mem-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.mem-stage canvas.g { cursor: grab; }
.mem-stage canvas.g.drag { cursor: grabbing; }
.mem-stage canvas.g.hov { cursor: pointer; }
.mem-legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--fg-3); pointer-events: none; }
.mem-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mem-zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--raise) 85%, transparent); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.mem-tip { position: absolute; z-index: 4; pointer-events: none; max-width: 280px; padding: 6px 10px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 12.5px; }
.mem-tip small { display: block; color: var(--fg-3); font-size: 11px; }
.mem-time { display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mem-time input[type=range] { flex: 1; accent-color: var(--accent); }
.mem-detail { position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(320px, calc(100% - 24px)); z-index: 5; display: flex; flex-direction: column; border-radius: 14px; background: color-mix(in srgb, var(--raise) 92%, transparent); border: 1px solid var(--line-2); box-shadow: var(--shadow); backdrop-filter: blur(12px); animation: slidein .22s var(--ease); }
@keyframes slidein { from { opacity: 0; translate: 10px 0; } }
.md-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 0 14px; }
.md-b { padding: 8px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.md-t { font: 400 20px/1.3 var(--serif); margin: 0; overflow-wrap: anywhere; }
.md-m { font-size: 12px; color: var(--fg-3); }
.md-path { font: 11.5px var(--mono); color: var(--fg-3); overflow-wrap: anywhere; }
.md-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.md-n { display: flex; flex-direction: column; gap: 1px; margin: 0 -8px; }
.md-n button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; text-align: left; }
.md-n button:hover { background: var(--hover); }
.md-n button span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-a { display: flex; gap: 6px; flex-wrap: wrap; }

/* Editor de nota */
.editor { width: min(1100px, 100%); height: min(760px, 100%); display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: var(--bg); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: rise .24s var(--ease); }
.ed-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.ed-h b { font: 400 18px var(--serif); }
.ed-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.ed-body textarea { resize: none; padding: 18px; font: 13px/1.7 var(--mono); border-right: 1px solid var(--line); background: var(--side); }
.ed-body textarea:focus-visible { outline: none; }
.ed-prev { overflow-y: auto; padding: 18px 24px; font-family: var(--serif); font-size: 16px; line-height: 1.65; }
.ed-prev h1, .ed-prev h2, .ed-prev h3 { font-weight: 500; margin: .9em 0 .4em; }
.ed-prev h1 { font-size: 28px; margin-top: 0; }
.ed-prev h2 { font-size: 21px; }
.ed-prev blockquote { margin: 0 0 .8em; padding: 6px 12px; border-left: 2px solid var(--line-3); color: var(--fg-2); }
.ed-prev .wl { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.ed-prev code { font-family: var(--mono); font-size: .78em; background: var(--raise-2); border-radius: 5px; padding: .1em .38em; }
.ed-prev .fm { font: 12px/1.6 var(--mono); color: var(--fg-3); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; white-space: pre-wrap; }

/* Segmentado, switch, select */
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; border: 1px solid var(--line-2); flex-wrap: wrap; }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; color: var(--fg-3); transition: background .15s, color .15s; }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--sel); color: var(--fg); }
.sw { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line-3); transition: background .18s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: translate .2s var(--ease); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { translate: 14px 0; }
.sel { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border-radius: 8px; font-size: 13px; }
.sel:hover { background: var(--hover); }
.sel .i { color: var(--fg-3); }
.sel.box { border: 1px solid var(--line-2); min-width: 200px; justify-content: space-between; }
.ta { width: 100%; min-height: 70px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raise); font-size: 13px; line-height: 1.5; }
.ta:focus { border-color: var(--line-3); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 0; }
.tagx { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--fg-2); }
.tagx button { display: grid; color: var(--fg-3); }

/* Configurações */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; translate: 0 6px; } }
.settings { position: relative; width: min(1060px, 100%); height: min(740px, 100%); display: grid; grid-template-columns: 236px minmax(0, 1fr); border-radius: 18px; overflow: hidden; background: var(--bg); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: rise .24s var(--ease); }
.set-nav { display: flex; flex-direction: column; gap: 1px; padding: 12px 8px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
.set-nav .side-search { margin: 0 0 8px; }
.set-nav .sec { margin: 16px 10px 4px; }
.set-nav .sec:first-of-type { margin-top: 6px; }
.set-main { position: relative; overflow-y: auto; padding: 0 44px 48px; }
.set-close { position: absolute; top: 10px; right: 12px; z-index: 2; }
.set-back { display: none; }
.set-title { margin: 30px 0 4px; font: 400 26px/1.15 var(--serif); letter-spacing: -.01em; }
.set-h { margin: 30px 0 2px; font-size: 13px; font-weight: 600; }
.set-lede { margin: 0 0 6px; font-size: 12.5px; color: var(--fg-3); }
.row { display: flex; align-items: center; gap: 24px; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--line); }
.row-t { font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-d { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; max-width: 54ch; }
.row-c { display: flex; align-items: center; gap: 8px; flex: none; }
.row-txt { min-width: 0; }
.input { height: 32px; width: 220px; max-width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raise); font-size: 13px; }
.input:focus { border-color: var(--line-3); }
.ram { display: flex; height: 8px; border-radius: 5px; overflow: hidden; margin: 18px 0 12px; gap: 2px; }
.ram i { display: block; height: 100%; }
.ram-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; font-size: 12.5px; color: var(--fg-2); }
.ram-legend div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ram-legend .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.ram-legend b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fg); }
.big-num { font: 400 36px/1 var(--serif); font-variant-numeric: tabular-nums; margin-top: 10px; }
.big-num small { font: 12.5px var(--ui); color: var(--fg-3); margin-left: 8px; }
.never { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 20px; padding: 10px 0; font-size: 13px; color: var(--fg-2); }
.never span { display: flex; align-items: center; gap: 8px; }
.never .i { color: var(--ok); }

/* Popover, paleta, toast, mini barra de voz */
.pop { position: fixed; z-index: 90; min-width: 240px; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px); overflow-y: auto; padding: 4px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: rise .16s var(--ease); }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
.pop button:hover, .pop button:focus-visible { background: var(--hover); outline: none; }
.pop .pd { display: block; font-size: 11.5px; color: var(--fg-3); }
.pop .ck { margin-left: auto; color: var(--fg); }
.pop .grp { padding: 8px 10px 3px; font-size: 11px; color: var(--fg-3); letter-spacing: .02em; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.pop .danger { color: var(--danger); }
.pal-scrim { place-items: start center; padding-top: 14vh; }
.pal { width: min(600px, 100%); border-radius: 16px; background: var(--raise); border: 1px solid var(--line-2); box-shadow: var(--shadow); overflow: hidden; animation: rise .2s var(--ease); }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.pal-in .i { color: var(--fg-3); }
.pal input { flex: 1; height: 52px; font-size: 15px; }

    zoomAt(px, py, f) { const [wx, wy] = this.toWorld(px, py); this.cam.k = Math.max(.2, Math.min(6, this.cam.k * f)); const [nx, ny] = this.toWorld(px, py); const c = Math.cos(this.rot), s = Math.sin(this.rot), dx = nx - wx, dy = ny - wy; this.cam.x += dx * c - dy * s; this.cam.y += dx * s + dy * c; this.draw(); },
    center(n) {
      if (!n) return; this.halt();
      const [rx, ry] = this.rotp(n), to = { x: -rx, y: -ry, k: Math.max(this.cam.k, 1.1) }, from = { ...this.cam };
      if (reduced()) { this.cam = to; this.draw(); return; }
      const t0 = performance.now(); const step = now => { const p = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - p, 3); this.cam = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e }; this.draw(); if (p < 1 && this.ctx) requestAnimationFrame(step); };

    },

    select(n) { this.sel = n || null; rDetail(); this.draw(); }
  };

  // ---------- Céu (entrada, início e fundo do grafo) ----------
  function drawSky(cv, { alpha = 1, constellation = true, belt = 0 } = {}) {
    if (!cv) return;
    const cx = cv.getContext("2d"), d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
    cv.width = w * d; cv.height = h * d; cx.setTransform(d, 0, 0, d, 0, 0); cx.clearRect(0, 0, w, h);
    const star = css("--star"), acc = css("--n-conceito"), sig = css("--signal");
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 240; i++) { cx.globalAlpha = (.06 + rnd() * .38) * alpha; cx.fillStyle = star; cx.beginPath(); cx.arc(rnd() * w, rnd() * h, .3 + rnd() * .9, 0, 6.283); cx.fill(); }
    if (!constellation) { cx.globalAlpha = 1; return; }
    const s = Math.min(w, h) * .92, ox = w / 2 - s / 2, oy = h / 2 - s / 2;
    const pts = [[.28, .12], [.72, .18], [.42, .5], [.5, .53], [.58, .56], [.32, .88], [.71, .86]].map(([x, y]) => [ox + x * s, oy + y * s]);
    cx.globalAlpha = .12 * alpha; cx.strokeStyle = star; cx.lineWidth = .8;
    [[0, 2], [1, 4], [2, 3], [3, 4], [2, 5], [4, 6]].forEach(([a, b]) => { cx.beginPath(); cx.moveTo(...pts[a]); cx.lineTo(...pts[b]); cx.stroke(); });
    pts.forEach((p, i) => {
      const isBelt = i >= 2 && i <= 4, col = i === 0 ? sig : i === 6 ? acc : isBelt && belt ? css("--ok") : star;
      const r = (i === 0 || i === 6 ? 3.6 : 2) * (isBelt && belt ? 1 + belt * .6 : 1);
      const g = cx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 6); g.addColorStop(0, col); g.addColorStop(1, "transparent");
      cx.globalAlpha = (isBelt && belt ? .25 + belt * .4 : .25) * alpha; cx.fillStyle = g; cx.beginPath(); cx.arc(p[0], p[1], r * 6, 0, 6.283); cx.fill();
      cx.globalAlpha = .95 * alpha; cx.fillStyle = col; cx.beginPath(); cx.arc(p[0], p[1], r, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1;
  }

    const label = SECS.flatMap(g => g[1]).find(s => s[0] === S.set.sec)[2];

    q = q.trim().toLowerCase();
    const convs = CONVS.filter(c => !q || (c.title + " " + c.proj + " " + c.msgs.map(m => m.text || m.html || "").join(" ")).toLowerCase().includes(q)).slice(0, 6).map(c => ({ l: c.title, g: "Conversa · " + c.proj, i: "chat", run: () => nav("chat", c.id) }));
    const notes = q ? VAULT.n.filter(a => a[0].toLowerCase().includes(q)).slice(0, 6).map(a => ({ l: a[0], g: "Nota · " + VAULT.f[a[2]].split("/")[0], i: "file", run: () => openNote(VAULT.f[a[2]] + "/" + a[0] + ".md") })) : [];
    const acts = [{ l: "Nova conversa", g: "Ação", i: "plus", run: () => nav("home") }, { l: "Configurações", g: "Ação", i: "gear", run: () => openSettings() }, { l: "Captura rápida", g: "Ação · Win + Shift + O", i: "inbox", run: () => openQcap() }, { l: "Isso? (capturar a tela)", g: "Ação · Win + Shift + I", i: "scan", run: () => openIsso() }, { l: prefs.auto ? "Desligar modo autônomo" : "Ligar modo autônomo", g: "Ação", i: "bolt", run: () => A.autotoggle() }, ...NAV.slice(1).concat(MORE).map(([v, i, l]) => ({ l: "Ir para " + l, g: "Ir para", i, run: () => nav(v) }))].filter(c => !q || (c.l + " " + c.g).toLowerCase().includes(q));
    return [...convs, ...notes, ...acts];
  }

    pal: openPal,

    ctxtab: b => { S.ctxOverride = true; S.ctxTab = b.dataset.v; rBar(); keepScroll(rBody); if (b.dataset.v === "term") $("#termIn")?.focus(); },
    "see-diff": () => { S.ctxOverride = true; S.ctxTab = "diff"; rBar(); keepScroll(rBody); if (innerWidth <= 1120) toast("index.rs: mmap no lugar de read; cache.rs: LRU de 64 MB"); },
    send, stop: () => { finishStream(true); keepScroll(rBody); rSide(); rBar(); },
    fill: b => { S.draft = b.dataset.t; refreshComposer(); },
    "fill-go": b => { nav("home"); S.draft = b.dataset.t; refreshComposer(); updateSug($("#input")); },
    attach: () => { const pool = [["print-claude.png", "1,2 MB"], ["heap-orion.txt", "84 KB"], ["fatura-outubro.pdf", "640 KB"], ["audio-ideia.m4a", "3,1 MB"]]; if (S.attach.length >= 4) return toast("Até 20 MB por arquivo. Maior que isso: ponha numa pasta e passe o caminho."); S.attach.push(pool[S.attach.length % pool.length]); refreshComposer(); },
    unattach: b => { S.attach.splice(+b.dataset.i, 1); refreshComposer(); },
    mic: () => toast("Gravando… clique de novo para enviar (simulado)"),
    live: () => { S.voice = !S.voice; rBar(); rIsland(); if (S.view === "home") drawSky($("#homeSky"), { alpha: .55, belt: S.voice ? 1 : 0 }); if (S.set.open) reSettings(); else if ($("#input")) refreshComposer(); },
    caption: () => { S.caption = !S.caption; rIsland(); reSettings(); },
    tools: b => { S.expand[b.dataset.k] = !S.expand[b.dataset.k]; keepScroll(rBody); },
    appr: b => {
      const [cid, idx] = b.dataset.k.split(":"); const c = CONVS.find(x => x.id === cid), a = c.msgs[+idx].approval;
      if (!a || a.state) return;
      a.state = b.dataset.v; a.at = nowHM(); if (c.state === "pending") c.state = "";
      ACT.unshift([a.at, cid === "ram" ? "Aplicar mudanças em 3 arquivos" : "Envio da branch para o origin", a.state === "ok" ? "ok" : "err", a.state === "ok" ? "aprovada" : "negada"]);
      rSide(); rBar(); keepScroll(rBody);
    },
    via: b => { const [cid, idx] = b.dataset.k.split(":"); const m = CONVS.find(x => x.id === cid).msgs[+idx]; toast(m.out ? `${m.via} · saiu do PC: ${m.out}` : `${m.via} · nada saiu do computador`); },
    copy: b => {
      const [cid, idx] = b.dataset.k.split(":"); const tmp = document.createElement("div"); tmp.innerHTML = CONVS.find(x => x.id === cid).msgs[+idx].html;
      if (!navigator.clipboard) return toast("Selecione o texto para copiar");
      navigator.clipboard.writeText(tmp.innerText).then(() => toast("Copiado"), () => toast("Não deu para copiar aqui. Selecione o texto."));
    },
    "copy-user": b => { const [cid, idx] = b.dataset.k.split(":"); const t = CONVS.find(x => x.id === cid).msgs[+idx].text; navigator.clipboard?.writeText(t).then(() => toast("Copiado"), () => toast("Selecione o texto para copiar")); },
    "edit-msg": b => { const [cid, idx] = b.dataset.k.split(":"); S.draft = CONVS.find(x => x.id === cid).msgs[+idx].text; refreshComposer(); toast("Editar e reenviar cria um ramo da conversa"); },
    "pin-msg": b => { const [cid, idx] = b.dataset.k.split(":"); const c = CONVS.find(x => x.id === cid); c.pin = c.msgs[+idx].text; keepScroll(rBody); toast("Fixada como contexto permanente"); },
    "conv-menu": b => { const c = conv(); pop(b, [{ l: c.pinned ? "Desafixar conversa" : "Fixar conversa", icon: "pin", k: "pin" }, { l: "Renomear", icon: "edit", k: "ren", d: "Título gerado sozinho, editável" }, { l: "Abrir nota no vault", icon: "file", k: "note" }, { l: "Arquivar", icon: "archive", k: "arch" }, "-", { l: "Apagar conversa", icon: "trash", danger: true, k: "del" }], it => {
      const i = CONVS.findIndex(x => x.id === S.conv);
      if (it.k === "del") { CONVS.splice(i, 1); toast("Conversa apagada"); nav("home"); }
      else if (it.k === "arch") { CONVS.splice(i, 1); ARCH.unshift({ id: c.id, t: c.title, proj: c.proj, d: "hoje", c }); toast("Conversa arquivada"); nav("home"); }
      else if (it.k === "pin") { c.pinned = !c.pinned; rSide(); toast(c.pinned ? "Conversa fixada" : "Conversa desafixada"); }
      else if (it.k === "note") { if (c.note) openNote(c.note.path); else toast("A nota é gravada no fim da primeira rodada"); }
      else toast("Renomear (simulado)");
    }); },
    account: b => pop(b, [{ l: prefs.name, d: "PC principal · notebook sincronizado", icon: "user" }, "-", { l: "Configurações", icon: "gear", k: "set" }, { l: "Privacidade e autonomia", icon: "shield", k: "priv" }, { l: "Atalhos", icon: "keys", k: "keys" }, "-", { l: "Sair", icon: "logout", k: "out" }], it => {
      if (it.k === "set") openSettings(); else if (it.k === "priv") openSettings("privacidade"); else if (it.k === "keys") openSettings("atalhos"); else if (it.k === "out") logout();
    }),
    "model-pick": b => {
      const items = [{ l: "Auto", d: PROV.auto.d, v: ["auto"], on: prefs.prov === "auto" }];
      ["claude", "codex", "gemini"].forEach(k => { items.push({ grp: PROV[k].l + " · " + PROV[k].d }); PROV[k].models.forEach(mo => items.push({ l: `${PROV[k].l} ${mo}`, v: [k, mo], on: prefs.prov === k && prefs.model === mo })); });
      items.push({ grp: "Orion" }, { l: "Orion", d: PROV.orion.d, v: ["orion"], on: prefs.prov === "orion" }, "-", { grp: "Esforço (Claude, Codex, Gemini)" }, ...EFFORT.map(([v, l]) => ({ l, ev: v, on: prefs.effort === v })));
      pop(b, items, it => { if (it.ev) setP("effort", it.ev); else { prefs.prov = it.v[0]; if (it.v[1]) prefs.model = it.v[1]; applyPrefs(); } if (S.set.open) reSettings(); else { keepScroll(rBody); if (!isMobile()) $("#input")?.focus(); } }, "right");
    },
    "proj-pick": b => pop(b, ["Orion", "Vault", "Lyra", "Nortis", "Sem projeto"].map(p => ({ l: p, icon: "folder", on: prefs.proj === p })), it => { setP("proj", it.l); refreshComposer(); }),
    "proj-open": b => { const c = CONVS.find(x => x.proj === b.dataset.p); if (c) nav("chat", c.id); else { setP("proj", b.dataset.p); nav("home"); } },
    rot: b => { const r = ROT.find(x => x.id === b.dataset.id); r.on = !r.on; rBody(); toast(r.on ? r.t + " ativada" : r.t + " pausada"); },
    "rot-run": b => { const r = ROT.find(x => x.id === b.dataset.id); r.last = "agora"; r.st = "ok"; r.runs = (r.runs + "o").slice(-7); rBody(); toast(`${r.t}: rodou agora. Saída: ${r.out}`); },
    actf: b => { S.actF = b.dataset.v; rBody(); },
    undo: b => { const a = ACT.find(x => x[1] === b.dataset.t); if (a) { a[4] = "undone"; ACT.unshift([nowHM(), "Desfeito: " + a[1].replace(/ \+ commit .*/, ""), "ok", "revert"]); } rBody(); toast(/commit/.test(b.dataset.t) ? "git revert feito e push na main do vault" : "Ação revertida"); },
    qcap: () => openQcap(),
    isso: () => openIsso(),
    "qcap-kind": b => { S.qkManual = true; S.qk = b.dataset.v; $$(".qcap .seg button").forEach(x => x.setAttribute("aria-checked", x.dataset.v === S.qk)); $("#qcapIn").focus(); },
    "shot-close": () => { $("#islandHost2").innerHTML = ""; },
    "rot-appr": b => { rotPend = false; ACT.unshift([nowHM(), "Organizar Downloads: mover 38 arquivos", b.dataset.v === "ok" ? "ok" : "err", b.dataset.v === "ok" ? "aprovada" : "negada"]); rSide(); rBar(); rBody(); },
    autotoggle: () => { setP("auto", !prefs.auto); rBar(); if (S.view === "aprovacoes") rBody(); if (S.set.open) reSettings(); toast(prefs.auto ? "Modo autônomo ligado. Ações que podem quebrar o PC ou o projeto continuam pedindo confirmação." : "Modo autônomo desligado"); },
    unarch: b => { const i = ARCH.findIndex(a => a.id === b.dataset.id), a = ARCH[i]; ARCH.splice(i, 1); CONVS.push(a.c || { id: a.id, title: a.t, proj: a.proj, day: "Mais antigos", state: "", msgs: [] }); toast("Conversa desarquivada"); rSide(); rBody(); },
    delarch: b => { ARCH.splice(ARCH.findIndex(a => a.id === b.dataset.id), 1); toast("Conversa apagada"); rBody(); },
    "mem-edit": b => { S.editMem = +b.dataset.id; rBody(); const el = $("#em-" + b.dataset.id); el.focus(); el.select(); },
    "mem-save": b => { const m = MEM.find(x => x.id === +b.dataset.id), el = $("#em-" + b.dataset.id); if (m && el && el.value.trim()) { m.t = el.value.trim(); m.src = "corrigido por você · hoje"; } S.editMem = null; rBody(); toast("Fato corrigido; commit na main"); },
    forget: b => { forgetMem(+b.dataset.id); rBody(); },
    toast: b => toast(b.dataset.msg),
    settings: b => openSettings(b.dataset.sec),
    "set-close": closeSettings,
    "set-scrim": (b, e) => { if (e.target.id === "setScrim") closeSettings(); },
    "set-sec": b => { S.set.sec = b.dataset.v; S.set.detail = true; S.set.wipe = false; reSettings(); $("#setMain").scrollTop = 0; },
    "set-back": () => { S.set.detail = false; reSettings(); },
    "set-go": b => { S.set.open = false; $("#overlay").innerHTML = ""; nav(b.dataset.v); },
    pref: b => { const v = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; setP(b.dataset.p, v); reSettings(); if (b.dataset.p === "lang" && v === "en") toast("English: strings come from Fluent files (mockup stays in Portuguese)"); },
    sw: b => { setP(b.dataset.p, !getP(b.dataset.p)); if (b.dataset.p === "cam.presenca" || b.dataset.p === "auto") rBar(); if (S.set.open) reSettings(); else rBody(); },
    sel: b => {
      const k = b.dataset.k;
      const opts = k === "font" ? [["serif", "Newsreader", "Serifada, como uma página"], ["sans", "Geist", "Sem serifa, igual à interface"], ["system", "Fonte do sistema", "Segoe UI no Windows"]]
        : (k === "lang" ? ["Português (Brasil)", "English (US)"] : ["Masculina, grave", "Masculina, clara"]).map(x => [x, x]);
      const path = { font: "font", lang: "voice.lang", style: "voice.style" }[k];
      pop(b, opts.map(([v, l, d]) => ({ l, d, v, on: getP(path) === v })), it => { setP(path, it.v); reSettings(); }, "right");
    },
    panic: b => { S.set.panic = b.dataset.v; if (b.dataset.v === "on") { prefs.auto = false; prefs.cam.presenca = false; S.voice = false; applyPrefs(); rIsland(); rBar(); toast("Tudo pausado. Nenhuma ferramenta de escrita, rede ou execução roda."); } reSettings(); },
    wipe: b => {
      if (b.dataset.v === "go") { CONVS.splice(0, CONVS.length); S.set.wipe = false; S.view = "home"; S.conv = null; S.hist = []; S.fwd = []; toast("Histórico apagado"); reSettings(); rSide(); rBar(); rBody(); return; }
      S.set.wipe = b.dataset.v === "1"; reSettings();
    },
    "obj-del": b => { prefs.objs.splice(+b.dataset.i, 1); applyPrefs(); reSettings(); },
    "obj-add": () => { const el = $("#objNew"); const v = el.value.trim(); if (v) { prefs.objs.push(v); applyPrefs(); } reSettings("objNew"); },
    logout,
    "pal-scrim": (b, e) => { if (e.target === b) closePal(); },
    "pal-run": b => runPal(+b.dataset.i),
    sug: b => pickSug(+b.dataset.i),
    "qcap-scrim": (b, e) => { if (e.target.id === "qcapScrim") $("#islandHost2").innerHTML = ""; },
    "shot-bg": (b, e) => { if (e.target.id === "shot") $("#islandHost2").innerHTML = ""; },
    "open-note": b => openNote(b.dataset.p),
    "note-close": closeNote,
    "note-scrim": (b, e) => { if (e.target.id === "noteScrim") closeNote(); },
    "note-save": () => { closeNote(); toast("Nota salva; commit e push na main do vault"); },
    gfilt: b => { const k = b.dataset.v; G.filt[k] = !G.filt[k]; b.setAttribute("aria-pressed", G.filt[k]); if (G.sel && !G.visible(G.sel)) G.select(null); memStats(); rDetail(); G.draw(); },
    gread: b => { G.readOn = !G.readOn; b.setAttribute("aria-pressed", G.readOn); G.halt(); G.draw(); },
    gzoom: b => { G.halt(); if (b.dataset.v === "fit") { G.fit(); G.draw(); } else G.zoomAt(G.w / 2, G.h / 2, b.dataset.v === "in" ? 1.25 : .8); },
    gpick: b => { const n = G.byId.get(b.dataset.id); const r = $("#memRes"); if (r) r.hidden = true; G.select(n); G.center(n); },
    gclose: () => G.select(null),
    "local-graph": b => { const n = G.byId.get(b.dataset.id); G.select(n); G.center(n); toast("Grafo local: só a nota e os vizinhos (profundidade 1)"); }
  };

  document.addEventListener("click", e => {
    const pi = e.target.closest("[data-pi]");
    if (pi && popCb) { const cb = popCb; closePop(); cb(+pi.dataset.pi); return; }
    if (!e.target.closest(".pop")) closePop();
    if (!e.target.closest(".mem-bar")) { const r = $("#memRes"); if (r) r.hidden = true; }
    if (!e.target.closest(".cmp-wrap") && S.sug) { S.sug = null; rSug(); }
    const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
    A[b.dataset.a]?.(b, e);
  });
  document.addEventListener("submit", e => { if (e.target.id === "gateForm") { e.preventDefault(); login(); } });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "input") { S.draft = t.value; fit(t); const s = $("[data-a=send]"); if (s) s.disabled = !t.value.trim(); updateSug(t); return; }
    if (t.id === "sideQ") { S.q = t.value; const n = t.value.length; rSide(); const i = $("#sideQ"); i.focus(); i.setSelectionRange(n, n); return; }
    if (t.id === "projQ") { S.projQ = t.value; const y = t.selectionStart; rBody(); const n = $("#projQ"); n.focus(); n.setSelectionRange(y, y); return; }
    if (t.id === "memQ") { memSearch(t.value); return; }
    if (t.id === "memTime") { G.cut = DATES[+t.value]; $("#memTimeL").textContent = "até " + G.cut.split("-").reverse().join("/"); G.halt(); if (G.sel && !G.visible(G.sel)) G.select(null); memStats(); G.draw(); return; }
    if (t.id === "noteEd") { $("#notePrev").innerHTML = mdRender(t.value); return; }
    if (t.id === "setQ") {
      S.set.q = t.value; const q = t.value.trim().toLowerCase();
      const first = SECS.flatMap(g => g[1]).find(([, , l, kw]) => q && (l + " " + kw).toLowerCase().includes(q));
      if (first && !isMobile()) S.set.sec = first[0];
      reSettings("setQ"); return;
    }
    if (t.dataset.p === "name" || t.dataset.p === "call") { prefs[t.dataset.p] = t.value || DEF[t.dataset.p]; applyPrefs(); rSide(); return; }
    if (t.dataset.p === "toneText") { prefs.toneText = t.value; applyPrefs(); return; }
    if (t.id === "palIn") { S.pal.sel = 0; palRender(); }
    if (t.id === "qcapIn" && !S.qkManual) { S.qk = guessKind(t.value); $$(".qcap .seg button").forEach(x => x.setAttribute("aria-checked", x.dataset.v === S.qk)); }
  });
  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if ($("#popHost").innerHTML) {
      if (e.key === "Escape") { closePop(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const bs = $$("#popHost button"); const i = bs.indexOf(document.activeElement); bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus(); return; }
    }
    if (!S.logged) return;
    if ($("#islandHost2").innerHTML && e.key === "Escape") { $("#islandHost2").innerHTML = ""; return; }
    if (e.target.id === "qcapIn" && e.key === "Enter") { e.preventDefault(); saveQcap(); return; }
    if (e.target.id === "issoIn" && e.key === "Enter") { e.preventDefault(); const a = $("#issoAns"); a.hidden = false; a.textContent = "É o painel de RAM do Orion: 296 MB em uso, com o índice vetorial em mmap ocupando a maior parte. Nada fora do normal."; return; }
    if (e.altKey && e.shiftKey && k === "o") { e.preventDefault(); openQcap(); return; }
    if (e.altKey && e.shiftKey && k === "i") { e.preventDefault(); openIsso(); return; }
    if (S.noteOpen && e.key === "Escape") { closeNote(); return; }
    if (S.pal.open) {
      if (e.key === "Escape") { closePal(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = S.pal.items.length || 1; S.pal.sel = (S.pal.sel + (e.key === "ArrowDown" ? 1 : -1) + n) % n; palRender(); return; }
      if (e.key === "Enter") { e.preventDefault(); runPal(S.pal.sel); return; }
    }
    if (e.target.id === "input" && S.sug) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = S.sug.items.length; S.sug.i = (S.sug.i + (e.key === "ArrowDown" ? 1 : -1) + n) % n; rSug(); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickSug(S.sug.i); return; }
      if (e.key === "Escape") { S.sug = null; rSug(); return; }
    }
    if (e.target.id === "input" && e.key === "ArrowUp" && !e.target.value) { const t = lastUserMsg(); if (t) { e.preventDefault(); S.draft = t; refreshComposer(); } return; }
    if (e.target.id === "termIn" && e.key === "Enter") { const v = e.target.value.trim(); if (v) { S.term.push("PS C:\\Projetos\\Orion> " + v, v === "git status" ? "On branch claude/funny-hamilton-jb1svh\nChanges not staged: 3 files" : "(protótipo: o terminal real roda PowerShell)", ""); $("#termOut").textContent = S.term.join("\n"); $("#termOut").scrollTop = 1e9; e.target.value = ""; } return; }
    if (e.target.id === "memQ") {
      const hits = G.hits;
      if (e.key === "Enter" && hits.length) { e.preventDefault(); const n = hits[G.resIdx] || hits[0]; $("#memRes").hidden = true; G.select(n); G.center(n); return; }
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && hits.length) { e.preventDefault(); G.resIdx = (G.resIdx + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; $$("#memRes button").forEach((b, i) => b.classList.toggle("hl", i === G.resIdx)); return; }
      if (e.key === "Escape") { $("#memRes").hidden = true; return; }
    }
    if (e.target.id === "objNew" && e.key === "Enter") { A["obj-add"](); return; }
    if (e.target.dataset?.mem && e.key === "Enter") { A["mem-save"]({ dataset: { id: e.target.dataset.mem } }); return; }
    if (mod && (e.key === "=" || e.key === "+" || e.key === "-")) { e.preventDefault(); const L = [90, 100, 115, 130, 150], i = L.indexOf(prefs.scale); setP("scale", L[Math.max(0, Math.min(L.length - 1, (i < 0 ? 1 : i) + (e.key === "-" ? -1 : 1)))]); toast("Escala " + prefs.scale + "%"); if (S.set.open) reSettings(); return; }
    if (mod && k === "k") { e.preventDefault(); if (S.pal.open) closePal(); else if (!S.set.open) openPal(); return; }
    if (e.key === "Escape" && S.set.open) { if (S.set.detail && isMobile()) A["set-back"](); else closeSettings(); return; }
    if (e.key === "Escape" && S.drawer) { A["drawer-close"](); return; }
    if (e.key === "Escape" && S.view === "memoria" && G.sel) { G.select(null); return; }
    if (mod && e.key === ",") { e.preventDefault(); S.set.open ? closeSettings() : openSettings(); return; }
    if (S.set.open) return;
    if (mod && e.shiftKey && k === "o") { e.preventDefault(); nav("home"); return; }
    if (mod && k === "b") { e.preventDefault(); A.collapse(); return; }
    if (e.target.id === "input" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  addEventListener("resize", () => { if (!S.logged) drawSky($("#sky")); else if (S.view === "home") drawSky($("#homeSky"), { alpha: .55, belt: S.voice ? 1 : 0 }); closePop(); });

  applyPrefs();
  render();
})();
</script>
